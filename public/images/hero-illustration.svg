<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brassHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C583"/>
      <stop offset="100%" stop-color="#9C7A3C"/>
    </linearGradient>
  </defs>

  <!-- vòng tròn nền mờ -->
  <circle cx="260" cy="210" r="190" fill="#ffffff" opacity="0.04"/>
  <circle cx="260" cy="210" r="150" fill="none" stroke="#9C7A3C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- tài liệu / hợp đồng -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="150" height="200" rx="6" fill="#ffffff" opacity="0.06" stroke="url(#brassHero)" stroke-width="1.5"/>
    <line x1="20" y1="35" x2="130" y2="35" stroke="url(#brassHero)" stroke-width="2" opacity="0.8"/>
    <line x1="20" y1="60" x2="110" y2="60" stroke="url(#brassHero)" stroke-width="1.5" opacity="0.55"/>
    <line x1="20" y1="80" x2="130" y2="80" stroke="url(#brassHero)" stroke-width="1.5" opacity="0.55"/>
    <line x1="20" y1="100" x2="95" y2="100" stroke="url(#brassHero)" stroke-width="1.5" opacity="0.55"/>
    <line x1="20" y1="130" x2="110" y2="130" stroke="url(#brassHero)" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="150" x2="130" y2="150" stroke="url(#brassHero)" stroke-width="1.5" opacity="0.4"/>
    <path d="M25 175 q10 -12 20 0 q10 -12 20 0" stroke="url(#brassHero)" stroke-width="2" fill="none" opacity="0.85"/>
  </g>

  <!-- cán cân công lý -->
  <g transform="translate(255,90)">
    <line x1="60" y1="10" x2="60" y2="130" stroke="url(#brassHero)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="5" fill="url(#brassHero)"/>
    <path d="M45 135 L75 135 L68 148 L52 148 Z" fill="url(#brassHero)"/>
    <ellipse cx="60" cy="150" rx="20" ry="4" fill="url(#brassHero)" opacity="0.5"/>

    <line x1="10" y1="26" x2="110" y2="26" stroke="url(#brassHero)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="60" y1="10" x2="10" y2="26" stroke="url(#brassHero)" stroke-width="1.6"/>
    <line x1="60" y1="10" x2="110" y2="26" stroke="url(#brassHero)" stroke-width="1.6"/>

    <line x1="10" y1="26" x2="0" y2="52" stroke="url(#brassHero)" stroke-width="1.2"/>
    <line x1="10" y1="26" x2="20" y2="52" stroke="url(#brassHero)" stroke-width="1.2"/>
    <path d="M-6 52 Q10 68 26 52" stroke="url(#brassHero)" stroke-width="2" fill="none"/>

