<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2745"/>
      <stop offset="100%" stop-color="#0F1729"/>
    </linearGradient>
    <linearGradient id="brass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C583"/>
      <stop offset="100%" stop-color="#9C7A3C"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="10" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="399" height="219" rx="10" fill="none" stroke="#9C7A3C" stroke-opacity="0.35"/>

  <!-- book stack (closed) -->
  <rect x="118" y="150" width="164" height="16" rx="2.5" fill="url(#brass2)" opacity="0.85"/>
  <rect x="128" y="132" width="144" height="16" rx="2.5" fill="url(#brass2)" opacity="0.65"/>

  <!-- open book on top -->
  <path d="M200 128 L92 138 L92 82 L200 70 Z" fill="#EDE7D8" opacity="0.92"/>
  <path d="M200 128 L308 138 L308 82 L200 70 Z" fill="#EDE7D8" opacity="0.85"/>
  <path d="M200 70 L200 128" stroke="#9C7A3C" stroke-width="1.5" opacity="0.6"/>

  <!-- page lines -->
  <line x1="105" y1="96" x2="188" y2="90" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>
  <line x1="105" y1="108" x2="190" y2="102" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>
  <line x1="105" y1="120" x2="192" y2="114" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>
  <line x1="212" y1="90" x2="295" y2="96" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>
  <line x1="210" y1="102" x2="295" y2="108" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>
  <line x1="208" y1="114" x2="295" y2="120" stroke="#9C7A3C" stroke-width="1" opacity="0.4"/>

  <!-- gavel resting diagonally -->
  <g transform="translate(255,50) rotate(28)">
    <rect x="-3" y="-30" width="6" height="70" rx="3" fill="url(#brass2)"/>
    <rect x="-22" y="34" width="44" height="16" rx="4" fill="url(#brass2)"/>
    <rect x="-22" y="34" width="44" height="5" rx="2.5" fill="#0F1729" opacity="0.35"/>
  </g>
</svg>
